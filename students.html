<style>

  body { margin: 0; background: #f4f6fa; color: var(--body);

  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

  /* Gate (다크) */
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #0b0f17 0%, #1e1b3a 100%); }
  .gate-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px 28px; max-width: 440px; width: 100%; color: #e5e7eb; }
  .gate-card h1 { margin: 0 0 6px; font-size: 20px; color: #f1f5f9; text-align: center; }
  .gate-card .sub { margin: 0 0 20px; font-size: 13px; color: #94a3b8; text-align: center; }
  .gate-card input, .gate-card select { width: 100%; background: #0b0f17; color: #e5e7eb; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 15px; font-family: inherit; margin-bottom: 10px; }
  .gate-card button { width: 100%; background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .gate-err { color: #fca5a5; font-size: 12.5px; min-height: 18px; margin-top: 8px; text-align: center; }

  /* Header (다크 유지) */
  header { background: linear-gradient(135deg, #1e1b3a 0%, #312e81 100%); padding: 16px 0; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; }
  header .container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 0; padding-bottom: 0; }
  header h1 { margin: 0; font-size: 18px; color: #f1f5f9; flex: 1; }
  header .badge { background: rgba(167,139,250,.2); color: #c4b5fd; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(167,139,250,.4); font-weight: 700; }
  header button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #e2e8f0; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  header button.logout { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.35); color: #fca5a5; }

  /* Toolbar */
  .toolbar { margin-top: 16px; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; border: 1px solid #cbd5e1; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-family: inherit; color: var(--ink); }
  .fchip { border: 1.5px solid #cbd5e1; background: #fff; color: #475569; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .toolbar select { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--ink); background: #fff; }
  .count-line { margin: 12px 2px 0; font-size: 12.5px; color: var(--muted); }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 10px; }
  .scard { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .scard:hover { box-shadow: 0 6px 18px rgba(15,23,42,.1); transform: translateY(-2px); }
  .scard img, .scard .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #f1f5f9; border: 2px solid #e2e8f0; }
  .scard .nm { margin-top: 8px; font-size: 15px; font-weight: 800; color: var(--ink); }
  .scard .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .scard .tags { margin-top: 6px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .tag { font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  .tag.rt-hi { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .tag.rt-mid { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .tag.rt-lo { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .tag.la { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .tag.ov { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

  /* Detail panel */
  .ovl { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 200; display: none; }
  .ovl.show { display: block; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: #f8fafc; z-index: 201; transform: translateX(105%); transition: transform .25s ease; overflow-y: auto; box-shadow: -12px 0 40px rgba(15,23,42,.25); }
  .panel.show { transform: none; }
  .panel-head { background: linear-gradient(135deg, #1e1b3a, #312e81); padding: 20px 18px; color: #f1f5f9; display: flex; gap: 14px; align-items: center; position: sticky; top: 0; z-index: 5; }
  .panel-head img, .panel-head .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(167,139,250,.6); background: #0b0f17; }
  .panel-head .nm { font-size: 20px; font-weight: 800; }
  .panel-head .meta { font-size: 12.5px; color: #c7d2fe; margin-top: 3px; }
  .panel-head .close { margin-left: auto; background: rgba(255,255,255,.12); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .psec { margin: 14px 14px 0; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .psec h3 { margin: 0 0 10px; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .psec h3 .sp { flex: 1; }
  .psec .mini-btn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }

  /* 출석 스트립 */
  .att-sum { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .att-strip { display: flex; gap: 4px; flex-wrap: wrap; }
  .att-dot { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
  .att-dot.p { background: #10b981; } .att-dot.a { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; } .att-dot.e { background: #f59e0b; }

  /* Vault */
  .vault-lock { text-align: center; padding: 10px 0; }
  .vault-lock input { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; width: 60%; min-width: 180px; }
  .vault-lock button { background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; margin-left: 6px; }
  .vault-lock .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .vault-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 6px; }
  .ct-grid { display: grid; grid-template-columns: 88px 1fr; gap: 7px 10px; font-size: 13.5px; }
  .ct-grid .k { color: var(--muted); font-weight: 700; font-size: 12.5px; }
  .ct-grid .v { color: var(--ink); word-break: break-all; }
  .ct-grid .v a { color: #7c3aed; text-decoration: none; font-weight: 700; }

  .note { border-left: 3px solid #cbd5e1; padding: 7px 12px; margin-top: 8px; background: #f8fafc; border-radius: 0 10px 10px 0; font-size: 13.5px; color: var(--ink); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #0f172a; color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 700; z-index: 500; transition: transform .25s; box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  .panel-head img { cursor: zoom-in; }
  .photo-ovl { position: fixed; inset: 0; background: rgba(10,13,20,.88); z-index: 400; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; cursor: zoom-out; padding: 20px; }

  .photo-ovl img { max-width: min(86vw, 520px); max-height: 72vh; border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.6); background: #1e293b; }

    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .scard .nm { font-size: 16px; }
    .ct-grid { font-size: 14.5px; }
    .note { font-size: 14.5px; }

</head>

/* ===== Vault (AES-GCM · 교적부 코드) ===== */
const Vault = (() => {
  const SALT = 'nsdhs-vault-2026', ITER = 150000;
  let key = null;
  const enc8 = s => new TextEncoder().encode(s);
  const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(code) {
    const base = await crypto.subtle.importKey('raw', enc8(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc8(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function unlock(code) {
    const k = await derive(code);
    const r = await fetch(REST + '/student_vault?name=eq.__check__&select=cipher,iv', { headers: H });
    const rows = r.ok ? await r.json() : [];
    if (!rows.length) throw new Error('vault 미설정');
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rows[0].iv) }, k, unb64(rows[0].cipher)); // 오답 시 throw
    key = k;
    try { sessionStorage.setItem('vault_code', code); } catch (e) {}
    return true;
  }
  async function tryRestore() {
    const code = sessionStorage.getItem('vault_code');
    if (!code) return false;
    try { await unlock(code); return true; } catch (e) { sessionStorage.removeItem('vault_code'); return false; }
  }
  async function dec(cipher, iv) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(cipher));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function encObj(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc8(JSON.stringify(obj)));
    return { cipher: b64(ct), iv: b64(iv) };
  }
  return { unlock, tryRestore, dec, encObj, unlocked: () => !!key, lock: () => { key = null; sessionStorage.removeItem('vault_code'); } };
})();
