function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function classStats(students) {
  let att = 0, la = 0, hi = 0, boys = 0; const g = { 1: 0, 2: 0, 3: 0 };
  for (const n of students) {
    const s = STUDENTS[n]; if (!s) continue;
    if (s.la) la++; else att++;
    if (!s.la && (s.rt || 0) >= 80) hi++;
    if (s.s === '남') boys++;
    g[s.g] = (g[s.g] || 0) + 1;
  }
  return { total: students.length, att, la, hi, boys, g };
}
function sortStudents(names) {
  return names.slice().sort((a, b) => {
    const sa = STUDENTS[a] || {}, sb = STUDENTS[b] || {};
    const laA = sa.la ? 1 : 0, laB = sb.la ? 1 : 0;
    if (laA !== laB) return laA - laB;
    return (sa.g || 0) - (sb.g || 0);
  });
}
function stuCard(name) {

    <span class="n">${esc(name)}</span>
    <span class="m">${s.g || ''}${s.s || ''}${s.la ? ' 🤍' : ''}</span>
    <span class="rt ${rtCls}">${s.rt === undefined ? '' : s.rt + '%'}</span>
  </div>`;

      <div class="fam-heading fam-${id}">🏠 대가족 ${FAMILY_NUM[id]} <span class="fam-sub">${esc(FAMILY_LABEL[id])}</span></div>

  }
  if (ungrouped.length) html += `<div class="fam-cards" style="margin-top:4px">${ungrouped.map(classCol).join('')}</div>`;
  html += `<div style="margin:18px 2px;font-size:11.5px;color:#94a3b8">카드 = 이름 · 학년/성별 · 출석%(2학기). 노란 카드 = 🤍 장결.</div>`;
  html += special;
  wrap.innerHTML = html;
}
async function loadBoard() {
  try {
    const pinnedId = new URLSearchParams(location.search).get('d');
    const q = pinnedId
      ? '/lineup_drafts?id=eq.' + encodeURIComponent(pinnedId) + '&select=name,data'
      : '/lineup_drafts?active=eq.true&status=eq.final&select=name,data&order=updated_at.desc&limit=1';
    const r = await fetch(REST + q, { headers: H });
    const rows = r.ok ? await r.json() : [];
    const vb = document.getElementById('ver-badge');
    if (pinnedId && rows[0]) { vb.textContent = '📌 ' + rows[0].name; vb.style.display = ''; }
    renderBoard(rows[0] ? rows[0].data : null);
  } catch (e) { renderBoard(null); }
}
function logAccess(teacher, page) {
  if (!teacher) return;
  try { const k = 'lastlog_' + page, n = Date.now(); if (n - (+(localStorage.getItem(k) || 0)) < 1800000) return; localStorage.setItem(k, String(n)); } catch (e) {}
  fetch(REST + '/access_log', { method: 'POST', headers: Object.assign({ 'Prefer': 'return=minimal' }, H), body: JSON.stringify({ teacher, page }) }).catch(() => {});
}

let MY = null;
function fillSelect() {
  const sel = document.getElementById('teacher-select');
  const sorted = ALL_TEACHERS.slice().sort((a, b) => a.localeCompare(b, 'ko'));
  sel.innerHTML = '<option value="">— 본인 이름 선택 —</option>' + sorted.map(t => `<option value="${t}">${t}</option>`).join('');
  const saved = localStorage.getItem('mock_teacher');
  if (saved && ALL_TEACHERS.includes(saved)) sel.value = saved;
}
function mockLogin() {
  const pin = (document.getElementById('pin-input').value || '').trim();
  const name = document.getElementById('teacher-select').value;
  const err = document.getElementById('gate-err');
  if (pin !== PRIVATE_KEY) { err.textContent = '❌ 접근 코드가 일치하지 않습니다'; return; }
  if (!name) { err.textContent = '❌ 본인 이름을 선택해 주세요'; return; }
  localStorage.setItem('mock_teacher', name);
  localStorage.setItem('access_pin', pin);
  showApp();
}
function logout() { localStorage.removeItem('mock_teacher'); location.reload(); }
async function showApp() {
  MY = localStorage.getItem('mock_teacher');
  if (!MY || !ALL_TEACHERS.includes(MY)) { logout(); return; }
  document.getElementById('gate-root').style.display = 'none';
  document.getElementById('app-root').style.display = '';
  document.getElementById('my-badge').textContent = MY + ' 선생님';
  logAccess(MY, 'board');
  await loadBoard();
}
fillSelect();
const savedPin = localStorage.getItem('access_pin');
const savedName = localStorage.getItem('mock_teacher');
if (savedPin === PRIVATE_KEY && savedName && ALL_TEACHERS.includes(savedName)) showApp();
document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') mockLogin(); });
</script>
