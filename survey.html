<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" type="image/svg+xml" href="logo-runner.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Runners 2026 · 수련회 평가</title>
<style>
  :root {
    --bg:#0b0f17; --bg2:#111827; --card:#1e293b; --border:#334155;
    --text:#e5e7eb; --muted:#94a3b8; --accent:#a78bfa; --accent2:#7c3aed;
    --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:linear-gradient(180deg,#0b0f17 0%,#0a0d14 100%); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",sans-serif;
    line-height:1.55; font-size:15px; min-height:100vh;
  }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 120px; }
  .brand { font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }
  h1 { font-size:21px; margin:6px 0 4px; }
  .intro { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--muted); font-size:13.5px; margin:16px 0; }
  .btn { display:block; width:100%; border:none; border-radius:10px; padding:15px; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer; margin-top:10px; }
  .btn-primary { background:linear-gradient(135deg,var(--accent2) 0%,var(--accent) 100%); color:#fff; }
  .btn-ghost { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:#e2e8f0; }
  .screen { display:none; }
  .screen.on { display:block; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Runners 2026</div>
  <h1>26년 여름수련회 평가</h1>

  <section id="sc-none" class="screen">
    <div class="intro">잘못된 링크입니다. 담당 선생님께 받은 링크로 다시 들어와 주세요.</div>
  </section>

  <section id="sc-landing" class="screen">
    <div class="intro">선생님, 수련회 섬기시느라 수고 많으셨습니다.<br>아래에서 우리 반 학생들에게 설문을 보내고, 선생님 설문도 남겨주세요.</div>
    <button class="btn btn-primary" id="btn-share">📤 우리 반 학생들에게 보내기</button>
    <button class="btn btn-ghost" id="btn-teacher">✍️ 선생님 설문 시작하기</button>
    <div class="intro" id="landing-count" style="text-align:center">응답 현황을 불러오는 중…</div>
  </section>

  <section id="sc-form" class="screen"></section>
  <section id="sc-done" class="screen"></section>
</div>
<div class="toast" id="toast"></div>

<script src="survey-questions.js"></script>
<script>
/* 라우팅 · 렌더러 · 제출 — Task 4~8에서 채운다 */
const URL_BASE = 'https://hycwzggbgnimuuhporwf.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5Y3d6Z2diZ25pbXV1aHBvcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTQzMTAsImV4cCI6MjA5NDAzMDMxMH0.NeypbxUYf5xoBagDBUPvhit3UOp6k_-_SN32JGgbEJg';
const REST = URL_BASE + '/rest/v1';
const H = { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON };

// Task 2에서 생성한 tokens.csv 의 '전체교사' 행 토큰
const TEACHER_TOKEN = '<<tokens.csv 전체교사 토큰>>';

const qs = new URLSearchParams(location.search);
let MODE = 'none', TOKEN = '';
if (qs.get('k'))      { MODE = 'landing'; TOKEN = qs.get('k'); }
else if (qs.get('t')) { MODE = 'teacher'; TOKEN = qs.get('t'); }
else if (qs.get('r')) { MODE = 'student'; TOKEN = qs.get('r'); }
else if (qs.get('p')) { MODE = 'praise';  TOKEN = qs.get('p'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

function boot() {
  if (MODE === 'none')    { showScreen('sc-none'); return; }
  if (MODE === 'landing') { showScreen('sc-landing'); initLanding(); return; }
  showScreen('sc-form');
  renderForm(MODE);   // Task 5
}

function initLanding() {}
function renderForm() { document.getElementById('sc-form').textContent = '(설문 렌더러 준비 중)'; }

document.getElementById('btn-teacher').addEventListener('click', () => {
  location.href = 'survey.html?t=' + encodeURIComponent(TEACHER_TOKEN);
});

boot();
</script>
</body>
</html>
