function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function sundayOf(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; }

function classForWeek(weekDateStr) {
  const start = new Date(TERM_START + 'T00:00:00');
  const d = new Date(weekDateStr + 'T00:00:00');
  const diffWeeks = Math.round((d - start) / (7 * 86400000));
  const len = DUTY_CLASSES.length;
  const idx = ((diffWeeks % len) + len) % len;
  return DUTY_CLASSES[idx];
}
function thisWeek() { return toDateStr(sundayOf(new Date())); }
function nextWeek() { const d = sundayOf(new Date()); d.setDate(d.getDate() + 7); return toDateStr(d); }
function fmtDate(dateStr) {
  const parts = dateStr.split('-');
  const y = +parts[0], m = +parts[1], day = +parts[2];
  const wk = ['일','월','화','수','목','금','토'];
  let w = ''; try { w = ' (' + wk[new Date(y, m-1, day).getDay()] + ')'; } catch (e) {}
  return m + '/' + day + w;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fillSelect() {
  const sel = document.getElementById('teacher-select');

  showApp();
}
function logout() {
  localStorage.removeItem('mock_teacher');
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('gate-root').style.display = '';
}

  if (!teacher) return;
  try { const k = 'lastlog_' + page, n = Date.now(); if (n - (+(localStorage.getItem(k) || 0)) < 1800000) return; localStorage.setItem(k, String(n)); } catch (e) {}
  fetch('https://hycwzggbgnimuuhporwf.supabase.co/rest/v1/access_log', {
    method: 'POST',
    headers: { apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5Y3d6Z2diZ25pbXV1aHBvcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTQzMTAsImV4cCI6MjA5NDAzMDMxMH0.NeypbxUYf5xoBagDBUPvhit3UOp6k_-_SN32JGgbEJg', Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5Y3d6Z2diZ25pbXV1aHBvcndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NTQzMTAsImV4cCI6MjA5NDAzMDMxMH0.NeypbxUYf5xoBagDBUPvhit3UOp6k_-_SN32JGgbEJg', 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ teacher: teacher, page: page })

/* ============================================================
 * 3. 진입 / 렌더링
 * ============================================================ */
let MY = null;
let SELECTED_WEEK = null;
let SHOW_LIST = false;

async function showApp() {
  const name = localStorage.getItem('mock_teacher');
  const me = TEACHERS.find(t => t.name === name);
  if (!me) { logout(); return; }
  MY = me;
  logAccess(me.name, 'worship-duty');

  document.getElementById('gate-root').style.display = 'none';
  document.getElementById('app-root').style.display = '';
  document.getElementById('my-badge').textContent = me.name + (me.cell ? ' · ' + me.cell : '');

  try {
    const rows = await DutyDB.list();
    DUTY_MAP = {};
    rows.forEach(r => { DUTY_MAP[r.week] = r; });
  } catch (e) { console.warn(e); }

  SELECTED_WEEK = nextWeek();
  renderDetail();
  renderList();
}

function flagFor(week) {
  const tw = thisWeek(), nw = nextWeek();
  if (week === nw) return '<span class="detail-flag flag-next">다음 주</span>';
  if (week === tw) return '<span class="detail-flag flag-this">이번 주</span>';
  if (week < tw) return '<span class="detail-flag flag-past">지난 순서</span>';
  return '';
}

function dutyCandidatesFor(cls) {
  const t = CELL_TEACHERS[cls] || {};
  const students = CELL_STUDENTS[cls] || [];
  const subs = [t.homeroom, t.sub].filter(Boolean);
  const alts = ['목사님', '안종범(부장)'].concat(subs.map(n => n + ' (' + cls + ' 선생님)'));
  return { students, alts };
}

function dutyPickGridHtml(field, cls, selected) {
  const { students, alts } = dutyCandidatesFor(cls);
  const sel = new Set(selected || []);
  const chip = n => '<button type="button" class="duty-pick-chip' + (sel.has(n) ? ' picked' : '') + '" data-field="' + field + '" data-name="' + escapeHtml(n) + '" onclick="toggleDutyPick(this)">' + (sel.has(n) ? '✅ ' : '➕ ') + escapeHtml(n) + '</button>';
  return '<div class="duty-pick-section-label">👥 ' + escapeHtml(cls) + ' 학생</div>' +
    '<div class="duty-pick-grid">' + students.map(chip).join('') + '</div>' +
    '<div class="duty-pick-section-label">🙋 대체 인원 (결석 시)</div>' +
    '<div class="duty-pick-grid">' + alts.map(chip).join('') + '</div>';
}

function toggleDutyPick(btn) {
  const picked = btn.classList.toggle('picked');
  btn.textContent = (picked ? '✅ ' : '➕ ') + btn.dataset.name;
}

let DUTY_EDIT_MODE = false;

function renderDetail() {
  const area = document.getElementById('detail-area');
  const week = SELECTED_WEEK;
  const cls = classForWeek(week);
  const row = DUTY_MAP[week] || {};
  const isEditing = DUTY_EDIT_MODE || !row.confirmed;

  if (isEditing) {
    area.innerHTML =
      '<div class="detail-card">' +
        '<div class="detail-head"><span class="detail-date">' + escapeHtml(fmtDate(week)) + '</span>' + flagFor(week) + '</div>' +
        '<div class="detail-class">' + escapeHtml(cls) + '</div>' +
        '<div class="duty-rows">' +
          ROLES.map(r =>
            '<div class="duty-role-block">' +
              '<div class="duty-role">' + escapeHtml(r.label) + '</div>' +
              dutyPickGridHtml(r.field, cls, row[r.field]) +
            '</div>'
          ).join('') +
        '</div>' +
        '<div class="edit-actions" style="margin-top:14px">' +
          '<button class="save-btn" onclick="confirmDuty()">✅ 완료</button>' +
          (row.confirmed ? '<button class="cancel-btn" onclick="cancelEditDuty()">취소</button>' : '') +
        '</div>' +
      '</div>';
  } else {
    area.innerHTML =
      '<div class="detail-card">' +
        '<div class="detail-head"><span class="detail-date">' + escapeHtml(fmtDate(week)) + '</span>' + flagFor(week) + '<span class="detail-flag" style="color:#6ee7b7;background:rgba(16,185,129,.15)">✅ 완료</span></div>' +
        '<div class="detail-class">' + escapeHtml(cls) + '</div>' +
        '<div class="duty-rows">' +
          ROLES.map(r => {
            const names = Array.isArray(row[r.field]) ? row[r.field] : [];
            return '<div class="duty-row">' +
              '<span class="duty-role">' + escapeHtml(r.label) + '</span>' +
              '<span class="duty-value">' + escapeHtml(names.length ? names.join(', ') : '미정') + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<button class="edit-btn" onclick="startEditDuty()">✏️ 수정</button>' +
      '</div>';
  }
}

function startEditDuty() { DUTY_EDIT_MODE = true; renderDetail(); }
function cancelEditDuty() { DUTY_EDIT_MODE = false; renderDetail(); }

async function confirmDuty() {
  const area = document.getElementById('detail-area');
  const week = SELECTED_WEEK;
  const cls = classForWeek(week);
  const patch = { id: week, week, class: cls, confirmed: true, updated_by: MY.name, updated_at: new Date().toISOString() };
  ROLES.forEach(r => {
    const picked = Array.from(area.querySelectorAll('.duty-pick-chip.picked[data-field="' + r.field + '"]')).map(b => b.dataset.name);
    patch[r.field] = picked;
  });
  try {
    await DutyDB.upsert(patch);
    DUTY_MAP[week] = Object.assign({}, DUTY_MAP[week], patch);
    DUTY_EDIT_MODE = false;
    renderDetail();
    renderList();
  } catch (e) { console.error(e); alert('저장 실패 — 다시 시도해 주세요'); }
}

function renderList() {
  const btn = document.getElementById('list-toggle-btn');
  const list = document.getElementById('duty-list');
  btn.textContent = SHOW_LIST ? '📋 목록 접기' : '📋 전체 일정 보기 (지난 순서·앞으로 순서)';
  list.style.display = SHOW_LIST ? 'flex' : 'none';
  if (!SHOW_LIST) { list.innerHTML = ''; return; }

  const start = sundayOf(new Date(TERM_START + 'T00:00:00'));
  const rows = [];
  for (let i = -8; i < 22; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i * 7);
    rows.push(toDateStr(d));
  }
  let lastMonth = '';
  list.innerHTML = rows.map(week => {
    const m = (+week.split('-')[1]) + '월';
    const monthHtml = m !== lastMonth ? '<div class="duty-month">' + m + '</div>' : '';
    lastMonth = m;
    const cls = classForWeek(week);
    const isSelected = week === SELECTED_WEEK;
    const tw = thisWeek(), nw = nextWeek();
    const flag = week === nw ? '<span class="dr-flag" style="color:#fcd34d">다음 주</span>' : (week === tw ? '<span class="dr-flag" style="color:#6ee7b7">이번 주</span>' : '');
    return monthHtml +
      '<div class="duty-list-row' + (isSelected ? ' selected' : '') + '" onclick="selectWeek(\'' + week + '\')">' +
        '<span class="dr-date">' + escapeHtml(fmtDate(week).replace(/\s*\(.\)$/, '')) + '</span>' +
        '<span class="dr-class">' + escapeHtml(cls) + '</span>' +
        flag +
      '</div>';
  }).join('');
}

function toggleList() { SHOW_LIST = !SHOW_LIST; renderList(); }

function selectWeek(week) {
  SELECTED_WEEK = week;
  DUTY_EDIT_MODE = false;
  renderDetail();
  renderList();
  document.getElementById('detail-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ============================================================
 * 4. 초기화
 * ============================================================ */
fillSelect();
const savedPin = localStorage.getItem('access_pin');
const savedName = localStorage.getItem('mock_teacher');
if (savedPin === PRIVATE_KEY && savedName && TEACHERS.find(t => t.name === savedName)) {
  showApp();
}
document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') mockLogin();
});
</script>

<script>

(function () {
